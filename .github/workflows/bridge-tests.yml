name: Experimental bridge tests

on:
  pull_request:
    paths:
      - 'src/colabcola/bridge_protocol.py'
      - 'src/colabcola/bridge_demo.py'
      - 'src/colabcola/bridge_video_benchmark.py'
      - 'src/colabcola/bridge_video_stream.py'
      - 'src/colabcola/bridge_video_inprocess.py'
      - 'src/colabcola/bridge_video_live.py'
      - 'src/colabcola/bridge_video_impairment.py'
      - 'src/colabcola/bridge_video_feedback.py'
      - 'src/colabcola/bridge_video_controller.py'
      - 'src/colabcola/bridge_video_rate.py'
      - 'src/colabcola/bridge_video_watchdog.py'
      - 'src/colabcola/bridge_video_recovery.py'
      - 'src/colabcola/bridge_video_load.py'
      - 'src/colabcola/bridge_video_load_control.py'
      - 'src/colabcola/bridge_video_burst.py'
      - 'src/colabcola/bridge_video_sender.py'
      - 'src/colabcola/bridge_video_pacing.py'
      - 'src/colabcola/bridge_video_sender_service.py'
      - 'src/colabcola/bridge_video_service.py'
      - 'src/colabcola/bridge_viewer_stats.py'
      - 'src/colabcola/bridge_colab.py'
      - 'src/colabcola/bridge_telemetry.py'
      - 'src/colabcola/bridge_colab_runtime.py'
      - 'src/colabcola/bridge_colab_comm_runtime.py'
      - 'src/colabcola/bridge_comm.py'
      - 'src/colabcola/bridge_pipeline.py'
      - 'src/colabcola/bridge_credit_sweep.py'
      - 'src/colabcola/bridge_sweep.py'
      - 'src/colabcola/bridge_ws_probe.py'
      - 'src/colabcola/cli.py'
      - 'tests/test_bridge.py'
      - 'tests/test_bridge_video_benchmark.py'
      - 'tests/test_bridge_video_stream.py'
      - 'tests/test_bridge_video_inprocess.py'
      - 'tests/test_bridge_video_live.py'
      - 'tests/test_bridge_video_impairment.py'
      - 'tests/test_bridge_video_feedback.py'
      - 'tests/test_bridge_video_controller.py'
      - 'tests/test_bridge_video_rate.py'
      - 'tests/test_bridge_video_watchdog.py'
      - 'tests/test_bridge_video_recovery.py'
      - 'tests/test_bridge_video_load.py'
      - 'tests/test_bridge_video_load_control.py'
      - 'tests/test_bridge_video_burst.py'
      - 'tests/test_bridge_video_burst_compare.py'
      - 'tests/test_bridge_video_sender.py'
      - 'tests/test_bridge_video_pacing.py'
      - 'tests/test_bridge_video_sender_service.py'
      - 'tests/test_bridge_video_service.py'
      - 'tests/test_bridge_viewer_stats.py'
      - 'tests/test_bridge_colab.py'
      - 'tests/test_bridge_comm.py'
      - 'tests/test_bridge_pipeline.py'
      - 'tests/test_bridge_credit_sweep.py'
      - 'tests/test_bridge_sweep.py'
      - 'tests/test_bridge_comm_local_kernel.py'
      - '.github/workflows/bridge-tests.yml'
  push:
    branches:
      - feature/interactive-bridge-prototype

permissions:
  contents: read

jobs:
  loopback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest ipykernel
      - name: Install FFmpeg (Linux codec regression)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install PyAV and NumPy (optional in-process codec regression)
        run: python -m pip install 'av>=17,<20' 'numpy>=2,<3'
      - name: Run bridge protocol and Tk tests (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q tests/test_bridge.py tests/test_bridge_colab.py tests/test_bridge_comm.py tests/test_bridge_comm_local_kernel.py tests/test_bridge_sweep.py tests/test_bridge_pipeline.py tests/test_bridge_credit_sweep.py tests/test_bridge_viewer_stats.py tests/test_bridge_video_benchmark.py tests/test_bridge_video_stream.py tests/test_bridge_video_inprocess.py tests/test_bridge_video_live.py tests/test_bridge_video_impairment.py tests/test_bridge_video_feedback.py tests/test_bridge_video_controller.py tests/test_bridge_video_rate.py tests/test_bridge_video_watchdog.py tests/test_bridge_video_recovery.py tests/test_bridge_video_load.py tests/test_bridge_video_load_control.py tests/test_bridge_video_burst.py tests/test_bridge_video_burst_compare.py tests/test_bridge_video_sender.py tests/test_bridge_video_pacing.py tests/test_bridge_video_sender_service.py tests/test_bridge_video_service.py
      - name: Demonstrate paced local H.264 video stream (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m colabcola.bridge_video_stream --width 640 --height 360 --fps 12 --frames 24 --pattern scene
          python -m colabcola.bridge_video_stream --width 640 --height 360 --fps 12 --frames 24 --pattern scene --decoder-low-delay
          python -m colabcola.bridge_video_stream --width 640 --height 360 --fps 60 --frames 48 --pattern square
          python -m colabcola.bridge_video_stream --width 640 --height 360 --fps 60 --frames 48 --pattern square --decoder-low-delay
          python -m colabcola.bridge_video_inprocess --width 640 --height 360 --fps 12 --frames 24 --pattern scene
          python -m colabcola.bridge_video_inprocess --width 640 --height 360 --fps 60 --frames 48 --pattern square
          python -m colabcola.bridge_video_live --width 640 --height 360 --fps 12 --frames 24 --max-seconds 5
          python -m colabcola.bridge_video_impairment --width 128 --height 72 --fps 24 --frames 36 --gop 12 --delay-ms 30 --jitter-ms 10 --bandwidth-kbps 2000 --max-inflight 12
          python -m colabcola.bridge_video_impairment --width 128 --height 72 --fps 24 --frames 36 --gop 12 --delay-ms 30 --jitter-ms 0 --bandwidth-kbps 0 --max-age-ms 0 --drop-seqs 5
          python -m colabcola.bridge_video_impairment --width 320 --height 180 --fps 30 --frames 48 --gop 12 --delay-ms 50 --jitter-ms 25 --bandwidth-steps 0:2500,500:120,1000:2500 --max-inflight 6 --max-age-ms 250 --seed 7
          python -m colabcola.bridge_video_feedback --width 128 --height 72 --fps 30 --frames 36 --gop 12 --delay-ms 40 --jitter-ms 0 --bandwidth-kbps 0 --max-age-ms 0 --max-inflight 16 --drop-seqs 5 --feedback-ms 20 --buffers-ms 40,80,120,180
          python -m colabcola.bridge_video_feedback --width 128 --height 72 --fps 30 --frames 48 --gop 12 --delay-ms 50 --jitter-ms 20 --bandwidth-steps 0:2500,300:130,850:2000 --max-age-ms 250 --max-inflight 8 --drop-seqs "" --buffers-ms 40,80,120,180,250
          python -m colabcola.bridge_video_controller --width 128 --height 72 --fps 30 --frames 60 --gop 24 --delay-ms 40 --jitter-ms 0 --bandwidth-kbps 0 --max-age-ms 0 --drop-seqs 5,27 --feedback-ms 20 --retry-ms 100 --buffers-ms 40,80,120
          python -m colabcola.bridge_video_controller --width 128 --height 72 --fps 30 --frames 60 --gop 24 --delay-ms 50 --jitter-ms 15 --bandwidth-steps 0:2500,400:130,1100:2200 --max-age-ms 200 --max-inflight 6 --drop-seqs "" --retry-ms 150 --buffers-ms 40,80,160,240
          python -m colabcola.bridge_video_rate --width 128 --height 72 --fps 30 --frames 90 --gop 24 --bandwidth-steps 0:1200,600:90,1750:1200 --delay-ms 40 --jitter-ms 8 --high-kbps 650 --low-kbps 95 --buffers-ms 80,160,240,350 --seed 7
          python -m colabcola.bridge_video_watchdog --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_watchdog --jitter-ms 0 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_recovery --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_recovery --jitter-ms 0 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_recovery --width 128 --height 72 --fps 30 --frames 60 --gop 24 --delay-ms 40 --jitter-ms 0 --bandwidth-steps= --bandwidth-kbps 0 --max-age-ms 0 --max-inflight 16 --drop-seqs 5,8,27 --control-delay-ms 20 --recovery-feedback-ms 20 --recovery-retry-ms 80 --recovered-age-ms 0 --min-switch-ms 0 --silence-timeout-ms 0 --buffers-ms 40,80,160
          python -m colabcola.bridge_video_load_control --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_load_control --jitter-ms 0 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_load_control --frames 120 --jitter-ms 0 --bandwidth-steps 0:1200,600:300,2200:1200 --max-inflight 32 --max-age-ms 1000 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_load_control --frames 120 --jitter-ms 0 --bandwidth-steps 0:1200,600:90 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_burst --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_burst --jitter-ms 0 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_burst --frames 120 --jitter-ms 0 --bandwidth-steps 0:1200,600:300,2200:1200 --max-inflight 32 --max-age-ms 1000 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_burst --frames 120 --jitter-ms 0 --bandwidth-steps 0:1200,600:90 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_burst --frames 36 --jitter-ms 0 --bandwidth-steps= --bandwidth-kbps 0 --max-age-ms 0 --max-inflight 16 --buffers-ms 40,80,160
          python -m colabcola.bridge_video_pacing --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_pacing --jitter-ms 0 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_pacing --frames 120 --jitter-ms 0 --bandwidth-steps 0:1200,600:300,2200:1200 --max-inflight 32 --max-age-ms 1000 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_pacing --frames 120 --jitter-ms 0 --bandwidth-steps 0:1200,600:90 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_pacing --frames 36 --jitter-ms 0 --bandwidth-steps= --bandwidth-kbps 0 --max-age-ms 0 --max-inflight 16 --buffers-ms 40,80,160
          python -m colabcola.bridge_video_service --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_service --jitter-ms 0 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_service --frames 120 --jitter-ms 0 --bandwidth-steps 0:1200,600:300,2200:1200 --max-inflight 32 --max-age-ms 1000 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_service --frames 120 --jitter-ms 0 --bandwidth-steps 0:1200,600:90 --buffers-ms 40,80,160,240,350
          python -m colabcola.bridge_video_service --frames 36 --jitter-ms 0 --bandwidth-steps= --bandwidth-kbps 0 --max-age-ms 0 --max-inflight 16 --buffers-ms 40,80,160
      - name: Run bridge protocol and Tk tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_bridge.py tests/test_bridge_colab.py tests/test_bridge_comm.py tests/test_bridge_comm_local_kernel.py tests/test_bridge_sweep.py tests/test_bridge_pipeline.py tests/test_bridge_credit_sweep.py tests/test_bridge_viewer_stats.py tests/test_bridge_video_benchmark.py tests/test_bridge_video_stream.py tests/test_bridge_video_inprocess.py tests/test_bridge_video_live.py tests/test_bridge_video_impairment.py tests/test_bridge_video_feedback.py tests/test_bridge_video_controller.py tests/test_bridge_video_rate.py tests/test_bridge_video_watchdog.py tests/test_bridge_video_recovery.py tests/test_bridge_video_load.py tests/test_bridge_video_load_control.py tests/test_bridge_video_burst.py tests/test_bridge_video_burst_compare.py tests/test_bridge_video_sender.py tests/test_bridge_video_pacing.py tests/test_bridge_video_sender_service.py tests/test_bridge_video_service.py

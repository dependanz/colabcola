name: Publish Colab Cola to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine pytest

      - name: Install package
        run: python -m pip install -e .

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import email
          import os
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          sdists = list(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sdists) == 1

          with zipfile.ZipFile(wheels[0]) as archive:
              name = next(
                  n for n in archive.namelist()
                  if n.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(
                  archive.read(name)
              )

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert metadata["Name"].lower() == "colabcola"
          assert metadata["Version"] == expected
          assert metadata["License-Expression"] == "Apache-2.0"
          print("Validated release:", expected)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/colabcola/

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: Experimental bridge tests

on:
  pull_request:
    paths:
      - 'src/colabcola/bridge_protocol.py'
      - 'src/colabcola/bridge_demo.py'
      - 'src/colabcola/cli.py'
      - 'tests/test_bridge.py'
      - '.github/workflows/bridge-tests.yml'
  push:
    branches:
      - feature/interactive-bridge-prototype

permissions:
  contents: read

jobs:
  loopback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run bridge protocol tests
        run: python -m pytest -q tests/test_bridge.py
